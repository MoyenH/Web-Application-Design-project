<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JobFinder - Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand"><a href="index.html" class="logo"><i class="fa-solid fa-briefcase"></i> JobFinder</a></div>
      <nav>
        <a href="index.html">Home</a>
        <a href="jobs.html">Job Search</a>
        <a href="companies.html">Companies</a>
        <a href="login.html" class="btn login"><i class="fa-solid fa-user"></i> Login</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container login-page">
      <h1><i class="fa-solid fa-user-lock"></i> Login</h1>
      <form class="login-form" id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="Enter your email"/>
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password"/>
        <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      </form>
      <div style="text-align:center; margin-top:16px;">
        <a href="#" style="color:#416dea;">Forgot Password?</a>
      </div>
    </div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
